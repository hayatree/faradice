# L6 (M2a validation): the V8 bus (four met2 bits between met1 and met3 cross
# lines) in a SKY130-like stratified stack instead of a uniform eps_r = 4.0.
# Interface heights and permittivities are read off the process stack diagram
# of the public SKY130 PDK documentation (Apache-2.0,
# https://skywater-pdk.readthedocs.io/en/main/rules/assumptions.html): each
# zone between consecutive metal bottoms gets the K printed for it. Conformal
# sidewall dielectrics (NILD3_C, NILD4_C, K = 3.5) are not stratified and are
# left out (M2c), so the stack is approximate.
schema_version = 1
units = "um"

[dielectric]
eps_r = 4.0                  # NILD6 and above (z > 4.0211)

[[dielectric.layer]]         # FOX + PSG
z_top = 0.9361
eps_r = 3.9

[[dielectric.layer]]         # LINT (li1 level)
z_top = 1.0361
eps_r = 7.3

[[dielectric.layer]]         # NILD2
z_top = 1.3761
eps_r = 4.05

[[dielectric.layer]]         # NILD3 (met1 level)
z_top = 2.0061
eps_r = 4.5

[[dielectric.layer]]         # NILD4 (met2 level)
z_top = 2.7861
eps_r = 4.2

[[dielectric.layer]]         # NILD5 (met3 level)
z_top = 4.0211
eps_r = 4.1

[[conductor]]
net = "bus[0]"
boxes = [[0.0000, 0.0000, 2.0061, 8.0000, 0.1400, 2.3661]]

[[conductor]]
net = "bus[1]"
boxes = [[0.0000, 0.2800, 2.0061, 8.0000, 0.4200, 2.3661]]

[[conductor]]
net = "bus[2]"
boxes = [[0.0000, 0.5600, 2.0061, 8.0000, 0.7000, 2.3661]]

[[conductor]]
net = "bus[3]"
boxes = [[0.0000, 0.8400, 2.0061, 8.0000, 0.9800, 2.3661]]

[[conductor]]
net = "m1_0"
boxes = [[1.5000, -1.0000, 1.3761, 1.6400, 1.9600, 1.7361]]

[[conductor]]
net = "m1_1"
boxes = [[3.9300, -1.0000, 1.3761, 4.0700, 1.9600, 1.7361]]

[[conductor]]
net = "m1_2"
boxes = [[6.3600, -1.0000, 1.3761, 6.5000, 1.9600, 1.7361]]

[[conductor]]
net = "m3_0"
boxes = [[2.5000, -1.0000, 2.7861, 2.8000, 1.9600, 3.6311]]

[[conductor]]
net = "m3_1"
boxes = [[5.2000, -1.0000, 2.7861, 5.5000, 1.9600, 3.6311]]
