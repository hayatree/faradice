[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build` / `cargo test` skip the experimental GPU engine, which needs
# Rust 1.87 (wgpu); select it with `-p faradice-gpu`, `--workspace` or `--features gpu`.
default-members = [
    "crates/faradice",
    "crates/faradice-core",
    "crates/faradice-engine",
    "crates/faradice-frw",
    "crates/faradice-gds",
    "crates/faradice-geom",
    "crates/faradice-io",
    "crates/faradice-sens",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The faradice contributors"]
repository = "https://github.com/hayatree/faradice"
keywords = ["eda", "capacitance", "parasitic-extraction", "random-walk", "vlsi"]
categories = ["science", "simulation"]

[workspace.dependencies]
faradice-core = { path = "crates/faradice-core", version = "0.1.0" }
faradice-geom = { path = "crates/faradice-geom", version = "0.1.0" }
faradice-frw = { path = "crates/faradice-frw", version = "0.1.0" }
faradice-io = { path = "crates/faradice-io", version = "0.1.0" }
faradice-gds = { path = "crates/faradice-gds", version = "0.1.0" }
faradice-gpu = { path = "crates/faradice-gpu", version = "0.1.0" }
faradice-engine = { path = "crates/faradice-engine", version = "0.1.0" }
faradice-sens = { path = "crates/faradice-sens", version = "0.1.0" }
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"
cast_lossless = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

# Statistical validation tests run millions of walks; keep them fast in CI.
[profile.test]
opt-level = 2
