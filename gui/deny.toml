# cargo-deny configuration of the GUI workspace. Same policy as the main
# workspace (permissive only, no GPL family); additionally checked by
# tools/license_audit.py for license texts bundled inside crates.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (no vulnerability) on transitive dependencies of
# iced 0.14 with no upgrade available. Revisit with every iced upgrade.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via fontdb/cosmic-text (iced) and ab_glyph (winit CSD)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: via zbus (mundy, iced_winit theme detection)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: via zbus (mundy, iced_winit theme detection)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via zbus (mundy, iced_winit theme detection)" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The patched crates under vendor/ are path dependencies with their original
# (permissive) license metadata.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
